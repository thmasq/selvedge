[workspace]
members = [
  "core",
  "proxy",
  "shared",
  "shell",
]
resolver = "2"

[workspace.metadata]
project_name = "selvedge"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/thmasq/selvedge"
description = "Web-based Matrix client with multi-threaded WASM architecture"

[workspace.dependencies]
ammonia = "4.1.4"
console_error_panic_hook = "0.1.7"
eyeball-im = "0.8.0"
futures = "0.3.33"
getrandom = { version = "0.3.4", features = ["wasm_js"] }
gloo-console = "0.4.0"
gloo-storage = "0.4.0"
gloo-timers = { version = "0.4.0", features = ["futures"] }
gloo-worker = "0.6.0"
indexmap = "2.14.0"
js-sys = "0.3.103"
leptos = { version = "0.8.20", features = ["csr"] }
matrix-sdk = { version = "0.18", default-features = false, features = ["js", "indexeddb", "e2e-encryption", "qrcode"] }
matrix-sdk-ui = { version = "0.18.0", default-features = false, features = ["js"] }
mime = "0.3.17"
paste = "1.0.15"
pulldown-cmark = "0.13.4"
rexie = "0.6.2"
ruma = { version = "0.16.0", features = ["full"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
serde_json = "1.0.151"
tantivy = { version = "0.26.1", default-features = false }
thiserror = "2.0.19"
uuid = { version = "1.24.0", features = ["v4", "serde", "js"] }
wasm-bindgen = "0.2.126"
wasm-bindgen-futures = "0.4.76"
web-sys = { version = "0.3.103", features = ["ServiceWorkerGlobalScope", "FetchEvent", "Cache", "CacheStorage", "Request", "Response", "Window", "IdbFactory", "IdbOpenDbRequest"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
